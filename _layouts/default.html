<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}Solia</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{{ page.title | default: 'Solia — Legal' }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#14120B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E7E3D7" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Solia legal home">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/brand/solia-wordmark-dark.svg' | relative_url }}">
      <img src="{{ '/assets/brand/solia-wordmark-light.svg' | relative_url }}" alt="Solia" width="112" height="44">
    </picture>
  </a>
  <details class="menu">
    <summary aria-label="Open menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </summary>
    <nav>
      <a href="https://getsolia.com/support">Support</a>
      <a href="{{ '/' | relative_url }}">Legal</a>
    </nav>
  </details>
</header>

<main>
  {% unless page.url == "/" %}<p class="back"><a href="{{ '/' | relative_url }}">&larr; All legal documents</a></p>{% endunless %}
  {{ content }}
</main>

<footer class="site">
  <p class="acronym"><strong>SOLIA</strong> — System for Optimizing Life with Intelligent Automation</p>
  <p>
    General &amp; legal <a href="mailto:legal@getsolia.com">legal@getsolia.com</a> ·
    Privacy &amp; data requests <a href="mailto:privacy@getsolia.com">privacy@getsolia.com</a> ·
    Support <a href="mailto:support@getsolia.com">support@getsolia.com</a>
  </p>
</footer>
</body>
</html>
